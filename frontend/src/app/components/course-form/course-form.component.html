<div class="card mx-auto" style="max-width: 500px">
  <div class="card-body">
    <h4 class="card-title mb-3">{{ courseId ? 'Edit course' : 'Add course' }}</h4>

    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="mb-3">
        <label class="form-label" for="name">Name</label>
        <input id="name" class="form-control" formControlName="name"
               [class.is-invalid]="name.touched && name.invalid">
        <div class="invalid-feedback">
          @if (name.hasError('required')) { Course name is required } @else { Name is too long }
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="description">Description</label>
        <textarea id="description" class="form-control" rows="3" formControlName="description"
                  [class.is-invalid]="description.touched && description.invalid"></textarea>
        <div class="invalid-feedback">Description must be 255 characters or less</div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a class="btn btn-secondary" routerLink="/courses">Cancel</a>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
